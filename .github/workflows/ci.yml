# Every push and PR: lint Python and shell, check the knowledge-base
# conventions, run the tests, and scan for committed secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/planka/*.sh scripts/githooks/pre-commit

      - name: Knowledge-base conventions
        run: python3 scripts/kb_lint.py --errors-only

      - name: Tests
        run: pytest -q

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
